name: Update newsletter & skills

on:
  schedule:
    - cron: "0 1 * * *"   # every day, 01:00 UTC
  workflow_dispatch:       # run by hand from the Actions tab
  repository_dispatch:
    types: [skills-updated]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_newsletter.py
      - run: python scripts/update_skills.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- newsletter.json skills.json || [ -n "$(git status --porcelain -- newsletter.json skills.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add newsletter.json skills.json
            git commit -m "Update newsletter issues and skills"
            git push
          else
            echo "Nothing new."
          fi
